note: >-
  No compliance certification, audit report or trust centre was found on any MemberPress surface
  probed on 2026-08-12, so no `Compliance` or `TrustCenter` pointer is emitted. This is a
  meaningful finding rather than an oversight: MemberPress moves card payments through Stripe,
  PayPal, Square and Authorize.net, and PCI scope in that model sits with the gateway and the
  site owner, not with the plugin vendor — but the plugin also stores member PII and billing
  history in the site owner's own database, which makes the absence of a published security or
  data-handling posture material to a buyer.
