note: >-
  MemberPress sells an annual WordPress plugin licence, not metered API access. The REST API and
  webhooks are NOT available on every tier — MemberPress lists "REST API / webhooks" and Zapier
  as Scale-plan features, while the AI Foundation MCP add-on is stated in MemberPress's own
  announcement to be available on all three plans. Prices below were the promotional prices shown
  on the pricing page on 2026-08-12, with MemberPress's own stated list price recorded alongside.
  No usage quota, overage rate or API call allowance is published, because none exists — the API
  runs on the customer's own server.
