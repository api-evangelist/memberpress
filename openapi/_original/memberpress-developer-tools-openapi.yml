components:
  securitySchemes:
    MemberPressApiKey:
      type: apiKey
      in: header
      name: MEMBERPRESS-API-KEY
      description: Developer Tools API key, as documented at https://memberpress.com/docs/overview-of-using-the-developer-tools/
    AuthorizationApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: The same Developer Tools API key sent in the `Authorization` header, as used by the
        MemberPress REST API documentation repository and its Postman collection. Note this is a bare
        key, not an RFC 7235 `Bearer <token>` credential.
  schemas:
    Error:
      type: object
      description: 'MemberPress returns WordPress REST API errors. The documented success envelope is
        `{"success": true, "data": {...}}`; WordPress core errors carry `code`, `message` and `data.status`.'
      properties:
        code:
          type: string
          description: WordPress error code slug.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
