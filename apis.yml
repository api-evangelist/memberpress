apis:
- aid: memberpress:developer-tools-rest-api
  name: MemberPress Developer Tools REST API
  description: 'REST API exposed by the MemberPress Developer Tools add-on on the site owner''s own
    WordPress installation, under the WordPress REST namespace mp/v1. Covers members, memberships,
    transactions, subscriptions, groups, rules, coupons, reminders and the event log, plus webhook
    subscribe/unsubscribe. Authenticated with a Developer Tools API key sent in the
    MEMBERPRESS-API-KEY header (the documentation repository and Postman collection send the same
    key in the Authorization header), or as a logged-in WordPress user holding the remove_users
    capability. MemberPress is self-hosted, so the base URL is always the customer''s own site.'
  humanURL: https://github.com/caseproof/memberpress-rest-api-documentation
  baseURL: https://{site}/wp-json/mp/v1
  tags:
  - Members
  - Memberships
  - Subscription
  - Transaction
  - Webhook
  tags_raw:
  - Members
  - Memberships
  - Subscriptions
  - Transactions
  - Webhooks
