apis:
- aid: memberpress:ai-foundation-mcp
  name: MemberPress AI Foundation MCP Server
  description: >-
    WordPress MCP server shipped by the MemberPress AI Foundation add-on. It exposes membership, subscription,
    transaction, coupon, access-rule and reporting tools — MemberPress states 41 tools on a standard install,
    with more added by the Courses, Corporate Accounts, Downloads and Gifting add-ons — to MCP clients
    such as Claude Desktop, Claude Code, Cursor, VS Code and Windsurf. The server runs inside the customer's
    own WordPress site, so there is no vendor-hosted remote MCP endpoint to introspect anonymously.
  humanURL: https://memberpress.com/blog/ai-foundation/
  baseURL: https://{site}/wp-json
  tags:
  - MCP
  - Artificial Intelligence
  - Reporting
  tags_raw:
  - MCP
  - AI
  - Reporting
  properties:
  - type: MCPServer
    url: mcp/memberpress-mcp.yml
  - type: ToolCrosswalk
    url: mcp/memberpress-tool-crosswalk.yml
  - type: Documentation
    url: https://memberpress.com/blog/ai-foundation/
  x-evidence:
    verified: '2026-08-12'
    method: docs
    note: >-
      Tool count and three named tools (get_course_completion_rates, get_member_billing_history, get_churn_predictions)
      are quoted from MemberPress's own announcement. The full tools/list manifest requires an authenticated
      customer installation; it was not introspected.
