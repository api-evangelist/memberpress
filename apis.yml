aid: memberpress
name: MemberPress
description: 'MemberPress is a WordPress membership, course and subscription-commerce plugin built
  by Caseproof. It turns a self-hosted WordPress site into a paid membership business — content
  protection through Smart Rules, memberships and groups as products, coupons, transactions,
  recurring subscriptions across Stripe, PayPal, Square and Authorize.net, courses and quizzes,
  ClubSuite communities and CoachKit coaching. Its developer surface is the Developer Tools add-on,
  which exposes a REST API under the WordPress namespace /wp-json/mp/v1 on the site owner''s own
  installation, plus a webhook subscription surface for fourteen membership and billing events. The
  AI Foundation add-on ships a WordPress MCP server that lets Claude, Cursor and VS Code read and
  act on membership data directly.'
image: https://memberpress.com/wp-content/uploads/2022/10/mp-icon-RGB_Icon-01.jpg
