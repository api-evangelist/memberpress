versioning:
  api_version: v1
  scheme: uri-namespace
  location: /wp-json/mp/v1
  policy_published: false
  note: >-
    The API namespace is mp/v1 and has never moved. MemberPress publishes no API versioning
    policy: nothing states how a v2 would be introduced, how long v1 would be supported, or
    whether the namespace tracks the plugin version. In practice the API's behaviour tracks the
    PLUGIN release the site owner has installed, so two MemberPress sites can expose materially
    different mp/v1 surfaces at the same moment — MemberPress itself says the authoritative
    endpoint and event list is the one rendered in that site's own Developer screen.
