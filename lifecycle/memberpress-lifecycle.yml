  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation headers, and no deprecation notices in
    the API documentation. MemberPress does deprecate and retire integrations at the product
    level — the changelog and blog record the PayPal legacy-gateway wind-down and several
    archived add-on repositories — but none of that is expressed on the API surface.
status_page:
  published: false
  probed:
  - url: https://status.memberpress.com/
    status: 000
    note: Host does not resolve.
  note: >-
    MemberPress operates no status page, which is coherent with the product being self-hosted —
    there is no vendor-run runtime whose availability could be reported. The consequence for an
    integrator is that there is no upstream signal at all: an outage is always the site owner's,
    and must be detected by the integrator's own monitoring.
